    auto_class: AutoModelForCausalLM
    use_text_config: true
    # 7 layers: sliding x5, full, sliding -> both attention types and crosses the
    # 6-layer attention-residual block boundary. Window / rel_extent below SEQ_LEN.
    # dtype float32: the checkpoint config says bfloat16, and from_config does not apply
    # _keep_in_fp32_modules_strict, so the fp32 router would fail even in eager.
    config_overrides: {num_hidden_layers: 7, layer_types: [hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid, hybrid_sliding], hidden_size: 512, num_attention_heads: 8, num_key_value_heads: 2, head_dim: 64, swa_num_attention_heads: 8, swa_num_key_value_heads: 2, swa_head_dim: 64, sliding_window_size: 16, rel_extent: 16, moe_intermediate_size: 256, n_routed_experts: 8, num_experts_per_tok: 2, vocab_size: 32000, unpadded_vocab_size: 31000, quantization_config: null, dtype: float32}
