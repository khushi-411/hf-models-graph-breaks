  # already tracked: checkpoints differ in config (sizes, positional variants, heads) and in which
  # Auto class people load them with (sentence-transformers / rerankers use AutoModel /
  # AutoModelForSequenceClassification). Already tracked by hf_id: gpt2, bert, t5, clip, qwen3, vit,
  # xlm_roberta, qwen3_8, roberta, gpt_oss, distilbert, opt.
  # Not added (transformers can't build them):
  #   - other libraries: whisperkit-coreml (CoreML), chronos-2 / chronos-bolt-small (chronos-forecasting),
  #     Kokoro-82M, faster-whisper-small (CTranslate2), pyannote/* (pyannote-audio), XTTS-v2 (coqui),
  #     Bingsu/adetailer (ultralytics), OmniVoice, Qwen3-TTS (no transformers model type), Kronos-Tokenizer,
  #     quail-voice-focus, audio.cpp-gguf, stable-diffusion-xl-base-1.0 / Comfy-Org/* / MiniMax-H3 (diffusion)
  #   - timm/mobilenetv3_small_100.lamb_in1k: TimmWrapper needs timm + torchvision (not in these source-built envs)
  #   - weight-format copies of a tracked or added model (from_config builds the same graph): *-GGUF repos,
  #     Qwen/Qwen3.8-27B-FP8 (= qwen3_8), Xenova/all-MiniLM-L6-v2 (ONNX of all_minilm_l6)
  # Bare encoders (AutoModel) have no labels, so their train_forward runs without a loss (like dinov3_vit).
