  # Same architecture as an entry above, but run through transformers' quantized layers. CUDA only, in the
  # torch-dev-quant env (torch-dev + accelerate, kernels, gguf) so the main envs keep their package set.
  # GGUF repos are not run: transformers dequantizes GGUF to bf16/fp32 on load, so the compiled graph is the base
  # model's. Their base models are covered by qwen3_8, gemma4_moe and qwen3_6_moe; Qwen3.8-Flash-Next (qwen4_exp)
  # and DeepSeek-V4.1-Flash (deepseek_v41) need a newer transformers than this checkout; Ornith-1.5 has no config.
  - name: qwen3_8_fp8
    hf_id: Qwen/Qwen3.8-27B-FP8
    auto_class: AutoModelForImageTextToText
    inputs: qwen_vl
    quantize: true
    # Same shapes as qwen3_8 (all multiples of the 128x128 FP8 block).
    config_overrides: {text_config.num_hidden_layers: 4, text_config.layer_types: [linear_attention, linear_attention, linear_attention, full_attention], text_config.hidden_size: 512, text_config.intermediate_size: 1024, text_config.num_attention_heads: 4, text_config.num_key_value_heads: 2, text_config.head_dim: 64, text_config.linear_num_key_heads: 4, text_config.linear_num_value_heads: 8, text_config.linear_key_head_dim: 32, text_config.linear_value_head_dim: 32, vision_config.depth: 2, vision_config.out_hidden_size: 512}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: "Top-100 #42. Fine-grained FP8 (e4m3, 128x128 blocks, dynamic activation scales) of qwen3_8."

  - name: deepseek_v32_fp8
    hf_id: deepseek-ai/DeepSeek-V3.2
    auto_class: AutoModelForCausalLM
    quantize: true
    config_overrides: {num_hidden_layers: 2, first_k_dense_replace: 1, layer_types: [indexed_attention, indexed_attention], mlp_layer_types: [dense, sparse], n_routed_experts: 8, num_experts_per_tok: 2, n_group: 4, topk_group: 2, hidden_size: 1024, num_attention_heads: 16, num_key_value_heads: 16, intermediate_size: 1024, moe_intermediate_size: 256, index_n_heads: 4, vocab_size: 32000}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: "Top-100 #22 as shipped: fine-grained FP8 with UE8M0 scales (deepseek_v32 runs it unquantized)."

  - name: gpt_oss_mxfp4
    hf_id: openai/gpt-oss-20b
    auto_class: AutoModelForCausalLM
    # Real MXFP4 checkpoint, first 2 layers (13 GB download). Quantizing random bf16 weights to MXFP4 on the fly
    # fails in eager (matmul_ogs `assert K == x.shape[-1]`), so `quantize: true` can't be used here.
    pretrained: true
    config_overrides: {num_hidden_layers: 2, layer_types: [sliding_attention, full_attention]}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: "Top-100 #60 as shipped: MXFP4 experts via the kernels-community gpt-oss Triton kernels (gpt_oss runs it unquantized)."

  - name: qwen3_6_moe
    hf_id: Qwen/Qwen3.6-35B-A3B
    auto_class: AutoModelForImageTextToText
    inputs: qwen_vl
    config_overrides: {text_config.num_hidden_layers: 4, text_config.layer_types: [linear_attention, linear_attention, linear_attention, full_attention], text_config.hidden_size: 512, text_config.moe_intermediate_size: 128, text_config.shared_expert_intermediate_size: 128, text_config.num_experts: 8, text_config.num_experts_per_tok: 2, text_config.num_attention_heads: 4, text_config.num_key_value_heads: 2, text_config.head_dim: 64, text_config.linear_num_key_heads: 4, text_config.linear_num_value_heads: 8, text_config.linear_key_head_dim: 32, text_config.linear_value_head_dim: 32, vision_config.depth: 2, vision_config.out_hidden_size: 512}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: "Base model of Top-100 #79 (Huihui-Qwen3.6-35B-A3B GGUF). Qwen3.5-MoE: gated delta net + MoE. CUDA only (triangular_solve needs CPU BLAS)."
