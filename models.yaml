  # --- Nov 2026 VLMs (full multimodal forward: vision tower + projector + LM) ---
  # vocab_size is kept at full size where the image token id would not fit in 32000.
  - name: hy_v4_vl
    hf_id: tencent/Hy4      # documented checkpoint; not public yet (tencent/Hy4-preview is the text-only hy_v4)
    auto_class: AutoModelForImageTextToText
    config_class: HYV4VLConfig
    inputs: grid_vlm
    pixel_layout: patches
    # 3 text layers: indexer full, full, shared (shared needs an earlier full); MLP dense, sparse, sparse.
    config_overrides: {text_config.num_hidden_layers: 3, text_config.layer_types: [indexed_attention, indexed_attention, indexed_attention], text_config.mlp_layer_types: [dense, sparse, sparse], text_config.indexer_types: [full, full, shared], text_config.hidden_size: 512, text_config.intermediate_size: 1024, text_config.moe_intermediate_size: 128, text_config.num_attention_heads: 8, text_config.num_key_value_heads: 8, text_config.q_lora_rank: 128, text_config.kv_lora_rank: 64, text_config.qk_nope_head_dim: 32, text_config.qk_rope_head_dim: 32, text_config.qk_head_dim: 64, text_config.head_dim: 32, text_config.v_head_dim: 32, text_config.index_topk: 16, text_config.index_head_dim: 64, text_config.index_n_heads: 4, text_config.n_routed_experts: 8, text_config.num_experts_per_tok: 2, vision_config.num_hidden_layers: 2, vision_config.out_hidden_size: 512}
