# Models tracked for torch.compile graph breaks.
#
# Fields:
#   name:          short id, used for results/<name>/ (required)
#   hf_id:         Hugging Face Hub repo id (required)
#   auto_class:    transformers Auto* class used to build the model (required)
#   inputs:        what dummy inputs to generate (default: text)
#                  - text:           input_ids (+ labels / decoder_input_ids)
#                  - image:          pixel_values (+ class labels)
#                  - audio_features: log-mel input_features (whisper)
#                  - audio_waveform: raw 16 kHz input_values (wav2vec2, hubert, moonshine, ...)
#                  - image_text:     input_ids + pixel_values (CLIP / SigLIP)
#                  - vlm:            LLaVA-style; the number of image placeholder tokens is
#                                    found with one eager probe forward
#                  - qwen_vl:        Qwen2.5-VL / Qwen3-VL (patches + image_grid_thw)
#   image_size:    override the input image size (int or [h, w])
#   pixel_ndim:    5 for models taking (batch, num_images, C, H, W) (vlm only)
#   token_type_ids / image_sizes: true to pass these extra VLM inputs (gemma3 / mistral3)
#   use_text_config: build a text-only LM from a multimodal checkpoint's text config
#   config_overrides: dict applied to the config before building the model.
#                  Graph breaks don't depend on weights or depth, so we shrink
#                  the model (fewer layers) to keep runs fast and small.
#                  Dotted keys reach sub-configs: `text_config.num_hidden_layers: 2`.
#                  pad_token_id is reset automatically if a smaller vocab_size drops it.
#   scenarios:     which scenarios to run (default: all applicable).
#                  - eval_forward:   model.eval(), no_grad, use_cache=False
#                  - eval_with_cache: model.eval(), no_grad, use_cache=True (decoder LMs)
#                  - train_forward:  model.train(), labels passed, grad enabled
#   notes:         free text
models:
  - name: gpt2
    hf_id: openai-community/gpt2
    auto_class: AutoModelForCausalLM
    inputs: text
    config_overrides:
      n_layer: 2
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: First model added.

  - name: qwen2
