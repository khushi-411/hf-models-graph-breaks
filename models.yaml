  - name: inkling2
    hf_id: thinkingmachines/Inkling-2-Small-MXFP8
    auto_class: AutoModelForCausalLM
    use_text_config: true
    # 7 layers: sliding x5, full, sliding -> both attention types and crosses the
    # 6-layer attention-residual block boundary. Window / rel_extent below SEQ_LEN.
    # dtype float32: the checkpoint config says bfloat16, and from_config does not apply
    # _keep_in_fp32_modules_strict, so the fp32 router would fail even in eager.
    config_overrides: {num_hidden_layers: 7, layer_types: [hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid, hybrid_sliding], hidden_size: 512, num_attention_heads: 8, num_key_value_heads: 2, head_dim: 64, swa_num_attention_heads: 8, swa_num_key_value_heads: 2, swa_head_dim: 64, sliding_window_size: 16, rel_extent: 16, moe_intermediate_size: 256, n_routed_experts: 8, num_experts_per_tok: 2, vocab_size: 32000, unpadded_vocab_size: 31000, quantization_config: null, dtype: float32}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: Text model of Inkling-2 (different architecture from `inkling`). Sigmoid-routed MoE, attention residual blocks, logit softcapping.

  - name: dots3_note
    hf_id: dots-studio/dots3-note-prev
    auto_class: AutoModelForCausalLM
    use_text_config: true
    # 3 layers: indexed (dense MLP), indexed (MoE), sliding (MoE). index_topk / window below SEQ_LEN.
    # head_dim * partial_rotary_factor (0.25) must equal qk_rope_head_dim, as in the real config (256 * 0.25 = 64).
    config_overrides: {num_hidden_layers: 3, layer_types: [indexed_attention, indexed_attention, sliding_attention], mlp_layer_types: [dense, sparse, sparse], hidden_size: 512, intermediate_size: 1024, moe_intermediate_size: 128, shared_experts_intermediate_size: 128, num_attention_heads: 8, num_key_value_heads: 8, head_dim: 128, q_lora_rank: 128, kv_lora_rank: 64, qk_rope_head_dim: 32, qk_nope_head_dim: 32, v_head_dim: 32, index_topk: 16, index_head_dim: 64, index_n_heads: 4, n_routed_experts: 8, num_experts_per_tok: 2, sliding_window: 16, vocab_size: 32000}
    scenarios: [eval_forward, eval_with_cache, train_forward]
    notes: Text model of dots3-note. MLA + indexed (top-k sparse) attention, sliding attention, sigmoid MoE.

