  - name: inkling2_vlm
    hf_id: thinkingmachines/Inkling-2-Small-MXFP8
    auto_class: AutoModelForImageTextToText
    inputs: grid_vlm
    pixel_layout: pixels
    grid: 4                     # 4x4 LM image tokens per image (each a 40x40 pixel block)
    config_overrides: {text_config.num_hidden_layers: 7, text_config.layer_types: [hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid_sliding, hybrid, hybrid_sliding], text_config.hidden_size: 512, text_config.num_attention_heads: 8, text_config.num_key_value_heads: 2, text_config.head_dim: 64, text_config.swa_num_attention_heads: 8, text_config.swa_num_key_value_heads: 2, text_config.swa_head_dim: 64, text_config.sliding_window_size: 16, text_config.rel_extent: 16, text_config.moe_intermediate_size: 256, text_config.n_routed_experts: 8, text_config.num_experts_per_tok: 2, text_config.dtype: float32, quantization_config: null, dtype: float32, vision_config.num_hidden_layers: 2, vision_config.text_hidden_size: 512, vision_config.dtype: float32}
