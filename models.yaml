    auto_class: AutoModelForImageTextToText
    inputs: grid_vlm
    pixel_layout: patches
    # 3 text layers cover all three types: conv, full_attention, sliding_attention.
    config_overrides: {text_config.num_hidden_layers: 3, text_config.layer_types: [conv, full_attention, sliding_attention], text_config.sliding_window: 16, text_config.hidden_size: 512, text_config.intermediate_size: 1024, text_config.num_attention_heads: 8, text_config.num_key_value_heads: 2, text_config.head_dim: 64, vision_config.num_hidden_layers: 2, dtype: float32, text_config.dtype: float32, vision_config.dtype: float32}
