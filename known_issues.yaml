  # ======================================================================= #
  # transformers-side root causes
  # ======================================================================= #
  # --- Dynamic shapes (results_dynamic/): recompiles caused by model code ---
  - id: problem-type-config-mutation
    title: "`ForSequenceClassificationLoss` sets `config.problem_type` on the first call -> `problem_type is None` guard fails, recompile"
    file: transformers/loss/loss_utils.py
    function: ForSequenceClassificationLoss
    repo: huggingface/transformers
    issue: null
    status: draft
    draft: issues/problem-type-config-mutation.md
    notes: >
      Not a dynamic-shape issue: the 2nd call always recompiles, whatever the input size (also with
      static shapes). Every *ForSequenceClassification / *ForImageClassification train run with
      problem_type unset (seen: vit). Not visible to check.py (explain() calls the model once).
      graph_breaks.dynamic pre-sets problem_type so it doesn't hide shape issues. Fix: infer it
      into a local variable instead of mutating the config.

  - id: mamba-associative-scan-seq-guard
    title: "`associative_scan` recompiles under dynamic=True: generic mode guards on (seq // 8) % 2 (CPU); pointwise mode + autograd specializes batch/seq (CUDA)"
    file: transformers/models/mamba/modeling_mamba.py
    repo: pytorch/pytorch
    issue: null
    status: draft
    draft: issues/mamba-associative-scan-seq-guard.md
    notes: >
      Root cause is torch._higher_order_ops.associative_scan, not the Mamba code: standalone repro
      issues/repros/associative_scan_dynamic_guards.py. mamba/jamba CPU eval: seq-parity guard;
      mamba/jamba/falcon_mamba CUDA train: batch (and seq) specialized at the associative_scan call.

  - id: nemotron-h-pad-size-guard
    title: "NemotronH: `if pad_size > 0:` on a shape-derived value -> recompile when seq_len % 16 changes"
    file: transformers/models/nemotron_h/modeling_nemotron_h.py
    repo: huggingface/transformers
    issue: null
    status: draft
    draft: issues/nemotron-h-pad-size-guard.md
    notes: >
      Guard ((16 - seq_len % 16) % 16) <= 0. Padding to a multiple of 16 is branch-free if the pad
      is always applied (F.pad with 0 is a no-op). eval 1 recompile; train 1 left once
      conv-backward-stride-guard is fixed.

  - id: loss-fn-warning-once
    title: "`loss_function` calls `logger.warning_once` inside forward when `loss_type` is None"
    file: transformers/modeling_utils.py
    function: loss_function
    match: "logging.Logger method not supported"
    repo: huggingface/transformers
    issue: null
    status: draft
    draft: issues/loss-fn-warning-once.md
    notes: >
      Affects models whose class name matches no LOSS_MAPPING key (e.g.
      GPT2LMHeadModel), so loss_type stays None. Only in train mode with labels.
      Still present on transformers main 58d05ca572 (5.23.0.dev0).
      Seen in: gpt2, openai_gpt, ctrl, reformer, bert_lm_head (all train_forward).
      Not fixable on the PyTorch side without a policy change: Dynamo breaks on
      logger calls by design unless the user opts in via
      ignore_logging_functions / reorderable_logging_functions (both empty by
      default), so the fix belongs in transformers.

