    title: "Mistral3 (Pixtral): split sizes from `image_sizes ... .tolist()` and per-image Python loops"
    file: transformers/models/mistral3/modeling_mistral3.py
    repo: huggingface/transformers
    issue: null
    status: draft
    notes: With capture flags 14 -> 9 graphs; remaining are data-dependent guards in the patch merger.
